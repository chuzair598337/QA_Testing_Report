name: Bug Fixer Agent

# Single headless `claude -p` call. Branches from development, patches,
# adds/updates a regression test, opens a PR back into development.
# Never merges, never pushes to development directly, never touches
# staging/production.

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: bug-fixer-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  fix:
    if: github.event.label.name == 'needs-fix'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - run: npm install -g @anthropic-ai/claude-code@latest

      - run: git checkout -b fix/issue-${{ github.event.issue.number }}

      - name: Run Bug Fixer
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          PROMPT="$(cat .claude/roles/bug-fixer.md)

          Issue #${{ github.event.issue.number }}: ${{ github.event.issue.title }}
          ${{ github.event.issue.body }}"
          claude -p "$PROMPT" \
            --allowedTools "Read,Edit,Write,Bash(npm run lint:*),Bash(npm run build:*),Bash(npx playwright test:*),Bash(git:*)" \
            --max-turns 25 \
            --output-format json > result.json

      - name: Push branch (if Claude committed anything)
        run: |
          git config user.name "bug-fixer-agent"
          git config user.email "agent@noreply.local"
          if [ -n "$(git log development..HEAD 2>/dev/null)" ]; then
            git push origin fix/issue-${{ github.event.issue.number }}
            echo "PUSHED=true" >> "$GITHUB_ENV"
          else
            echo "No commits on the fix branch — Bug Fixer likely stopped and commented instead. Skipping PR."
            echo "PUSHED=false" >> "$GITHUB_ENV"
          fi

      - name: Open PR
        if: env.PUSHED == 'true'
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create --title "Fix: issue #${{ github.event.issue.number }}" \
            --body "Auto-generated fix. See #${{ github.event.issue.number }} for context." \
            --label "needs-approval,agent-generated" \
            --base development \
            --head fix/issue-${{ github.event.issue.number }}
