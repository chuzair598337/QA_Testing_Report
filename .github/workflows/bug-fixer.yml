name: Bug Fixer Agent

# Single headless `claude -p` call. Branches from development, patches,
# adds/updates a regression test, opens a PR back into development.
# Never merges, never pushes to development directly, never touches
# staging/production.
#
# workflow_dispatch is a manual test/re-run escape hatch. Note: GitHub only
# lets you dispatch a workflow (by filename or ID) once that file exists on
# the repo's *default* branch (main) — this applies to workflow_dispatch
# itself, not just `issues`/`schedule`. Until this pipeline is promoted to
# main, neither `labeled` nor manual dispatch can reach it; both work once
# it's there:
#   gh workflow run bug-fixer.yml --ref <any-branch> -f issue_number=<n>

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to run against (manual test trigger)
        required: true
        type: number

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: bug-fixer-${{ github.event.issue.number || github.event.inputs.issue_number }}
  cancel-in-progress: true

jobs:
  fix:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'needs-fix'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Resolve issue
        id: issue
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NUM="${{ github.event.inputs.issue_number || github.event.issue.number }}"
          echo "number=$NUM" >> "$GITHUB_OUTPUT"
          { echo 'title<<TITLE_EOF'; gh issue view "$NUM" --json title -q .title; echo 'TITLE_EOF'; } >> "$GITHUB_OUTPUT"
          { echo 'body<<BODY_EOF'; gh issue view "$NUM" --json body -q .body; echo 'BODY_EOF'; } >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - run: npm install -g @anthropic-ai/claude-code@latest

      - run: git checkout -b fix/issue-${{ steps.issue.outputs.number }}

      - name: Run Bug Fixer
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # inherited by any npm run build / npx playwright test Claude runs
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          PROMPT="$(cat .claude/roles/bug-fixer.md)

          Issue #${{ steps.issue.outputs.number }}: ${{ steps.issue.outputs.title }}
          ${{ steps.issue.outputs.body }}"
          claude -p "$PROMPT" \
            --allowedTools "Read,Edit,Write,Bash(npm run lint:*),Bash(npm run build:*),Bash(npx playwright test:*),Bash(git:*)" \
            --max-turns 25 \
            --output-format json > result.json

      - name: Push branch (if Claude committed anything)
        run: |
          git config user.name "bug-fixer-agent"
          git config user.email "agent@noreply.local"
          if [ -n "$(git log development..HEAD 2>/dev/null)" ]; then
            git push origin fix/issue-${{ steps.issue.outputs.number }}
            echo "PUSHED=true" >> "$GITHUB_ENV"
          else
            echo "No commits on the fix branch — Bug Fixer likely stopped and commented instead. Skipping PR."
            echo "PUSHED=false" >> "$GITHUB_ENV"
          fi

      - name: Open PR
        if: env.PUSHED == 'true'
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create --title "Fix: issue #${{ steps.issue.outputs.number }}" \
            --body "Auto-generated fix. See #${{ steps.issue.outputs.number }} for context." \
            --label "needs-approval,agent-generated" \
            --base development \
            --head fix/issue-${{ steps.issue.outputs.number }}
