name: QA

# The QA gate. Deterministic — no LLM here, just lint/build, so it's cheap
# and fast to run on every PR into development, nightly against development,
# and as a read-only smoke test on every push to staging.
#
# On failure it only files an issue (bug + agent-generated, plus
# caught-in-staging when the source was staging). Bug Detector picks it up
# from there — this workflow never fixes anything itself.

on:
  pull_request:
    branches: [development]
  push:
    branches: [staging]
  schedule:
    - cron: '0 3 * * *' # nightly against development
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: qa-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'development' || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        id: lint
        run: npm run lint

      - name: Build
        id: build
        run: npm run build

      - name: File issue on failure
        if: failure()
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SOURCE="development"
          EXTRA_LABEL=""
          if [ "${{ github.event_name }}" = "push" ]; then
            SOURCE="staging"
            EXTRA_LABEL="caught-in-staging"
          fi

          TITLE="QA failure on $SOURCE ($(date -u +%Y-%m-%d) — run ${{ github.run_id }})"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          BODY="QA gate failed on **$SOURCE** — [workflow run]($RUN_URL).

          - Trigger: \`${{ github.event_name }}\`
          - Commit: \`${{ github.sha }}\`
          - Lint step: \`${{ steps.lint.outcome }}\`
          - Build step: \`${{ steps.build.outcome }}\`

          Bug Detector: investigate and fix against \`development\` regardless
          of where this was caught — staging is a detection point, not a
          second fix pipeline."

          LABELS="bug,agent-generated"
          if [ -n "$EXTRA_LABEL" ]; then
            LABELS="$LABELS,$EXTRA_LABEL"
          fi

          gh issue create --title "$TITLE" --body "$BODY" --label "$LABELS"
