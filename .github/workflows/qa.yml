name: QA Agent

# Pure Playwright — no Claude involved, free. Runs on every PR into
# development and on a schedule against development. On failure: uploads
# the trace artifact and opens an issue labeled bug + agent-generated.

on:
  pull_request:
    branches: [development]
  schedule:
    - cron: '0 */6 * * *' # every 6 hours

permissions:
  contents: read
  issues: write

concurrency:
  group: qa-agent-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: qa-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          # PR-triggered runs check out the PR ref automatically; scheduled
          # runs have no PR context, so pin them to development explicitly.
          ref: ${{ github.event_name == 'schedule' && 'development' || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Run tests
        id: tests
        run: npx playwright test
        continue-on-error: true

      - name: Upload traces on failure
        if: steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: app/test-results/
          retention-days: 14

      - name: Open bug issue on failure
        if: steps.tests.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `QA failure: ${context.sha.substring(0, 7)}`,
              body: `Playwright detected a test failure on \`development\`.\n\n` +
                    `- Trigger: \`${context.eventName}\`\n` +
                    `- Commit: \`${context.sha}\`\n` +
                    `- Trace artifact: [workflow run](${runUrl})\n\n` +
                    `Bug Detector: investigate against \`development\`.`,
              labels: ['bug', 'agent-generated'],
            });

      - name: Fail job if tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1
