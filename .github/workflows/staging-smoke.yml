name: Staging Smoke Test

# Read-only smoke test against the deployed staging URL. No fix pipeline
# runs against staging directly — this only files an issue. A staging
# regression still gets fixed via a development PR and re-promoted
# normally, same as any other bug.
#
# Requires the STAGING_URL repo secret (e.g. https://staging.example.com).

on:
  push:
    branches: [staging]

permissions:
  contents: read
  issues: write

concurrency:
  group: staging-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: staging-smoke-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Run smoke tests against staging
        id: smoke
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
        run: npx playwright test --config=playwright.staging.config.ts
        continue-on-error: true

      - name: Upload traces on failure
        if: steps.smoke.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: staging-smoke-traces
          path: app/test-results/
          retention-days: 14

      - name: Open bug issue on failure
        if: steps.smoke.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Staging regression: ${context.sha.substring(0, 7)}`,
              body: `Caught in staging, not development.\n\n` +
                    `- Commit: \`${context.sha}\`\n` +
                    `- Trace artifact: [workflow run](${runUrl})\n\n` +
                    `Needs a \`development\` fix + re-promotion — staging is a ` +
                    `detection point, not a second fix pipeline.`,
              labels: ['bug', 'agent-generated', 'caught-in-staging'],
            });

      - name: Fail job if smoke test failed
        if: steps.smoke.outcome == 'failure'
        run: exit 1
