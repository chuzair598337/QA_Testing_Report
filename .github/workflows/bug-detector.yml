name: Bug Detector Agent

# Read-only investigation. Single headless `claude -p` call, Read/Grep/Glob
# only — it cannot edit files or run bash, since it's the agent with the
# least oversight before its output routes the rest of the pipeline.

on:
  issues:
    types: [labeled]

permissions:
  contents: write # only for the deterministic agent-memory commit below
  issues: write

concurrency:
  group: bug-detector-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  detect:
    if: github.event.label.name == 'bug'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development

      - run: npm install -g @anthropic-ai/claude-code@latest

      - name: Run Bug Detector
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          PROMPT="$(cat .claude/roles/bug-detector.md)

          Issue #${{ github.event.issue.number }}: ${{ github.event.issue.title }}
          ${{ github.event.issue.body }}"
          claude -p "$PROMPT" \
            --allowedTools "Read,Grep,Glob" \
            --max-turns 6 \
            --output-format json > result.json

      - name: Post comment, route, and record to agent-memory
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');

            const result = JSON.parse(fs.readFileSync('result.json', 'utf8'));
            const body = result.result;
            const issueNumber = context.issue.number;

            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: issueNumber, body,
            });

            const label = body.includes('ROUTE: needs-ui') ? 'needs-ui' : 'needs-fix';
            await github.rest.issues.addLabels({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: issueNumber, labels: [label],
            });

            // Deterministic, docs-only — not authored by Claude, so this
            // doesn't cost the read-only agent any tool access.
            fs.mkdirSync('agent-memory/bug-reports', { recursive: true });
            fs.writeFileSync(`agent-memory/bug-reports/issue-${issueNumber}.md`, body + '\n');
            execSync('git config user.name "bug-detector-agent"');
            execSync('git config user.email "agent@noreply.local"');
            execSync(`git add agent-memory/bug-reports/issue-${issueNumber}.md`);
            execSync(`git commit -m "chore(agent-memory): bug-detector report for #${issueNumber}"`);
            execSync('git push origin development');
