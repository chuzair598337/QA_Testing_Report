name: UI Agent

# Same shape as Bug Fixer, triggered on needs-ui. Tools scoped to this
# repo's actual styling/component paths (app/src/styles, app/src/components,
# app/src/views — Vue SFCs mix template/script/style in one file, so the
# role prompt is what enforces "styling only" within a component; the glob
# scope keeps it out of everything else: stores, composables, router, lib).

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: ui-agent-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  fix:
    if: github.event.label.name == 'needs-ui'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - run: npm install -g @anthropic-ai/claude-code@latest

      - run: git checkout -b ui/issue-${{ github.event.issue.number }}

      - name: Run UI Agent
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          PROMPT="$(cat .claude/roles/ui-agent.md)

          Issue #${{ github.event.issue.number }}: ${{ github.event.issue.title }}
          ${{ github.event.issue.body }}"
          claude -p "$PROMPT" \
            --allowedTools "Read,Edit(src/styles/**),Edit(src/components/**),Edit(src/views/**),Write(src/styles/**),Bash(npm run lint:*),Bash(npm run build:*),Bash(npx playwright test:*),Bash(git:*)" \
            --max-turns 25 \
            --output-format json > result.json

      - name: Push branch (if Claude committed anything)
        run: |
          git config user.name "ui-agent"
          git config user.email "agent@noreply.local"
          if [ -n "$(git log development..HEAD 2>/dev/null)" ]; then
            git push origin ui/issue-${{ github.event.issue.number }}
            echo "PUSHED=true" >> "$GITHUB_ENV"
          else
            echo "No commits on the ui branch — UI Agent likely stopped and commented instead (e.g. needed Bug Fixer). Skipping PR."
            echo "PUSHED=false" >> "$GITHUB_ENV"
          fi

      - name: Open PR
        if: env.PUSHED == 'true'
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create --title "UI fix: issue #${{ github.event.issue.number }}" \
            --body "Auto-generated UI/layout fix. See #${{ github.event.issue.number }} for context." \
            --label "needs-approval,agent-generated" \
            --base development \
            --head ui/issue-${{ github.event.issue.number }}
