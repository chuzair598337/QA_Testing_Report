<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QA Testing Report</title>
<style>
  :root{
    color-scheme: light;
    --bg:#F5F7FA;
    --surface:#FFFFFF;
    --border:#E1E6ED;
    --border-strong:#C9D1DC;
    --ink:#152238;
    --ink-soft:#5B6779;
    --ink-faint:#8B95A5;
    --primary:#164E87;
    --primary-soft:#E8F0FA;
    --accent:#00B2DD;
    --pass:#178A4C;
    --pass-bg:#E7F6EE;
    --fail:#C2361E;
    --fail-bg:#FCEBE7;
    --pending:#8B95A5;
    --pending-bg:#EEF1F5;
    --mono: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --radius: 8px;
    --shadow: 0 1px 2px rgba(21,34,56,0.04), 0 4px 12px rgba(21,34,56,0.04);
    --hover-bg:#F0F3F7;
    --surface-alt:#FBFCFE;
    --primary-hover:#123E6D;
  }

  html[data-theme="dark"]{
    color-scheme: dark;
    --bg:#0F1520;
    --surface:#161D2B;
    --border:#2A3448;
    --border-strong:#3A465D;
    --ink:#E7ECF4;
    --ink-soft:#A6B1C4;
    --ink-faint:#6E7A90;
    --primary:#4C9BE8;
    --primary-soft:#16283F;
    --accent:#28C8ED;
    --pass:#3DD583;
    --pass-bg:#132A20;
    --fail:#F0685A;
    --fail-bg:#2E1712;
    --pending:#7C8AA0;
    --pending-bg:#1D2536;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 14px rgba(0,0,0,0.28);
    --hover-bg:#1E293C;
    --surface-alt:#1B2334;
    --primary-hover:#6FB2EF;
  }

  html{ background:var(--bg); transition:background .15s ease; }
  body{ transition:background .15s ease, color .15s ease; }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- Icons (Lucide, inlined) ---------- */
  .icon{
    width:14px; height:14px;
    stroke:currentColor;
    fill:none;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
    flex-shrink:0;
    display:block;
  }
  .icon-sm{ width:12px; height:12px; }
  .icon-md{ width:16px; height:16px; }

  /* ---------- Header / Dashboard ---------- */
  header.report-head{
    position:sticky;
    top:0;
    z-index:50;
    background:var(--surface);
    border-bottom:1px solid var(--border);
    box-shadow:var(--shadow);
  }
  .head-inner{
    max-width:1040px;
    margin:0 auto;
    padding:20px 24px 16px;
  }
  .head-top{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
    margin-bottom:16px;
  }
  .head-title-block .eyebrow{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--accent);
    font-weight:600;
  }
  .head-title-block h1{
    margin:4px 0 2px;
    font-size:22px;
    font-weight:700;
    letter-spacing:-0.01em;
    color:var(--ink);
  }
  .head-actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  button.btn{
    appearance:none;
    -webkit-appearance:none;
    -moz-appearance:none;
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-family:var(--sans);
    font-size:13px;
    font-weight:600;
    padding:8px 14px;
    border-radius:6px;
    border:1px solid var(--border-strong);
    background:var(--surface);
    color:var(--ink);
    cursor:pointer;
    transition:background .12s ease, border-color .12s ease;
    white-space:nowrap;
  }
  button.btn:hover{ background:var(--hover-bg); }
  button.btn.primary{
    background:var(--primary);
    border-color:var(--primary);
    color:#fff;
  }
  button.btn.primary:hover{ background:var(--primary-hover); }
  button.btn.danger{
    border-color:var(--fail);
    color:var(--fail);
  }
  button.btn.danger:hover{ background:var(--fail-bg); }
  button.btn[disabled]{ opacity:.6; cursor:progress; }

  /* Stat tiles */
  .stat-grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:10px;
    margin-bottom:14px;
  }
  .stat-tile{
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:10px 12px;
  }
  .stat-tile .stat-label{
    font-family:var(--mono);
    font-size:10.5px;
    letter-spacing:.05em;
    text-transform:uppercase;
    color:var(--ink-faint);
  }
  .stat-tile .stat-value{
    font-size:22px;
    font-weight:700;
    font-family:var(--mono);
    margin-top:2px;
  }
  .stat-tile.total .stat-value{ color:var(--ink); }
  .stat-tile.passed .stat-value{ color:var(--pass); }
  .stat-tile.failed .stat-value{ color:var(--fail); }
  .stat-tile.percent .stat-value{ color:var(--primary); }

  /* Progress bar */
  .progress-wrap{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .progress-track{
    flex:1;
    height:10px;
    border-radius:999px;
    background:var(--pending-bg);
    overflow:hidden;
    display:flex;
    border:1px solid var(--border);
  }
  .progress-seg.pass{ background:var(--pass); height:100%; transition:width .25s ease; }
  .progress-seg.fail{ background:var(--fail); height:100%; transition:width .25s ease; }
  .progress-caption{
    font-family:var(--mono);
    font-size:12px;
    font-weight:700;
    color:var(--ink);
    white-space:nowrap;
  }

  /* Filter + jump nav */
  .toolbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
    padding-top:12px;
    margin-top:12px;
    border-top:1px solid var(--border);
  }
  .filter-group{ display:flex; gap:6px; flex-wrap:wrap; }
  .filter-btn{
    font-family:var(--mono);
    font-size:11.5px;
    padding:5px 10px;
    border-radius:5px;
    border:1px solid var(--border-strong);
    background:var(--surface);
    color:var(--ink-soft);
    cursor:pointer;
  }
  .filter-btn.active{
    background:var(--primary);
    border-color:var(--primary);
    color:#fff;
  }
  .jump-group{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  select.jump-select{
    font-family:var(--mono);
    font-size:11.5px;
    padding:6px 26px 6px 10px;
    border-radius:6px;
    border:1px solid var(--border-strong);
    background:var(--surface);
    color:var(--ink-soft);
    cursor:pointer;
    appearance:none;
    -webkit-appearance:none;
    background-image:linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
    background-position: calc(100% - 14px) center, calc(100% - 9px) center;
    background-size: 5px 5px, 5px 5px;
    background-repeat:no-repeat;
    max-width:220px;
  }
  select.jump-select:focus{ outline:2px solid var(--accent); outline-offset:1px; }

  /* Pinned bar */
  .pinned-bar{
    display:flex;
    align-items:flex-start;
    gap:12px;
    padding-top:12px;
    margin-top:12px;
    border-top:1px solid var(--border);
    flex-wrap:wrap;
  }
  .pinned-label{
    display:flex;
    align-items:center;
    gap:6px;
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.05em;
    text-transform:uppercase;
    color:var(--ink-faint);
    padding-top:4px;
    flex-shrink:0;
  }
  .pinned-items{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    flex:1;
  }
  .pinned-chip{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--pending-bg);
    border:1px solid var(--border-strong);
    border-radius:6px;
    padding:5px 6px 5px 10px;
  }
  .pinned-chip-label{
    font-family:var(--mono);
    font-size:11.5px;
    color:var(--ink);
    cursor:pointer;
    background:none;
    border:none;
    padding:0;
    text-align:left;
  }
  .pinned-chip-label:hover{ color:var(--primary); }
  .pinned-chip .mini-bar{ width:36px; }
  .pinned-unpin{
    display:inline-flex;
    align-items:center;
    color:var(--ink-faint);
    background:none;
    border:none;
    cursor:pointer;
    padding:2px 4px;
    line-height:1;
  }
  .pinned-unpin:hover{ color:var(--fail); }

  /* ---------- Main content ---------- */
  main{
    max-width:1040px;
    margin:0 auto;
    padding:28px 24px 80px;
  }

  .module{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    margin-bottom:18px;
    box-shadow:var(--shadow);
    overflow:hidden;
    scroll-margin-top:230px;
  }
  .module-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:16px 18px;
    cursor:pointer;
    background:linear-gradient(180deg, var(--surface), var(--surface-alt));
  }
  .module-head:hover{ background:var(--hover-bg); }
  .module-head-left{ display:flex; align-items:center; gap:10px; min-width:0; flex:1 1 auto; }
  .module-num{
    font-family:var(--mono);
    font-weight:700;
    color:var(--primary);
    font-size:15px;
    flex-shrink:0;
  }
  .module-title{
    font-size:16px;
    font-weight:700;
    color:var(--ink);
  }
  .module-count{
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-faint);
    white-space:nowrap;
  }
  .module-meta{
    display:flex;
    align-items:center;
    gap:6px;
    flex-shrink:0;
  }
  .mini-bar{
    width:64px;
    height:6px;
    border-radius:999px;
    background:var(--pending-bg);
    overflow:hidden;
    display:flex;
    border:1px solid var(--border);
    flex-shrink:0;
  }
  .chevron-icon{
    color:var(--ink-faint);
    transition:transform .15s ease;
    transform:rotate(0deg);
    flex-shrink:0;
  }
  .module.collapsed .chevron-icon,
  .submodule.collapsed .chevron-icon{ transform:rotate(-90deg); }
  .module-body{
    border-top:1px solid var(--border);
  }
  .module.collapsed .module-body{ display:none; }

  .lock-badge{ display:inline-flex; color:var(--primary); flex-shrink:0; }

  .submodule{ padding:0 18px; }
  .submodule + .submodule{ border-top:1px dashed var(--border); }
  .submodule.filtered-out{ display:none; }
  .module.filtered-out{ display:none; }
  .submodule-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:12px 6px 12px 4px;
    cursor:pointer;
    border-radius:6px;
  }
  .submodule-title:hover{ background:var(--hover-bg); }
  .submodule-head-left{ display:flex; align-items:center; gap:8px; min-width:0; flex:1 1 auto; }
  .submodule-meta{ display:flex; align-items:center; gap:6px; flex-shrink:0; }
  .sub-num{
    font-family:var(--mono);
    font-weight:600;
    color:var(--ink-soft);
    font-size:13px;
    flex-shrink:0;
  }
  .sub-title-text{
    font-size:14px;
    font-weight:600;
    color:var(--ink);
  }
  .sub-count{
    font-family:var(--mono);
    font-size:10.5px;
    color:var(--ink-faint);
    white-space:nowrap;
  }
  .submodule-body{ padding-bottom:4px; }
  .submodule.collapsed .submodule-body{ display:none; }

  /* Ellipsis "more options" menu (Pin/Unpin, Lock/Unlock) */
  .menu-wrap{ position:relative; flex-shrink:0; }
  .icon-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:28px; height:28px;
    border-radius:6px;
    border:1px solid transparent;
    background:none;
    color:var(--ink-faint);
    cursor:pointer;
    flex-shrink:0;
  }
  .icon-btn:hover{ background:var(--pending-bg); color:var(--ink-soft); }
  .icon-btn.active-state{ color:var(--primary); }
  .dropdown-menu{
    position:absolute;
    top:calc(100% + 4px);
    right:0;
    min-width:150px;
    background:var(--surface);
    border:1px solid var(--border-strong);
    border-radius:8px;
    box-shadow:0 8px 24px rgba(21,34,56,0.16);
    padding:4px;
    display:none;
    z-index:30;
  }
  .dropdown-menu.open{ display:block; }
  .dropdown-item{
    display:flex;
    align-items:center;
    gap:8px;
    width:100%;
    padding:7px 9px;
    border:none;
    background:none;
    border-radius:6px;
    font-family:var(--sans);
    font-size:12.5px;
    font-weight:600;
    color:var(--ink);
    cursor:pointer;
    text-align:left;
  }
  .dropdown-item:hover{ background:var(--hover-bg); }
  .dropdown-item .icon{ color:var(--ink-soft); }

  /* Test case row */
  .test-row{
    padding:10px 0 10px 4px;
    border-top:1px solid var(--border);
  }
  .submodule .test-row:first-of-type{ border-top:none; }
  .test-row[data-status="fail"]{ background:linear-gradient(90deg, var(--fail-bg), transparent 40%); }
  .test-row[data-status="pass"]{ background:linear-gradient(90deg, var(--pass-bg), transparent 40%); }
  .test-row.filtered-out{ display:none; }
  .test-row.locked{ opacity:.65; }

  .test-main{
    display:flex;
    align-items:flex-start;
    gap:10px;
    flex-wrap:wrap;
  }
  .test-id{
    font-family:var(--mono);
    font-size:12.5px;
    color:var(--ink-faint);
    padding-top:4px;
    min-width:56px;
    flex-shrink:0;
  }
  .test-text{
    flex:1 1 260px;
    font-size:14px;
    color:var(--ink);
    padding-top:3px;
    min-width:180px;
  }
  .test-controls{
    display:flex;
    align-items:center;
    gap:6px;
    flex-shrink:0;
    margin-left:auto;
  }

  .status-dot{
    width:8px; height:8px;
    border-radius:50%;
    flex-shrink:0;
    margin-top:6px;
  }
  .status-dot.pending{ background:var(--pending); }
  .status-dot.pass{ background:var(--pass); }
  .status-dot.fail{ background:var(--fail); }

  .status-select-wrap{
    position:relative;
    display:inline-block;
  }
  select.status-select{
    appearance:none;
    -webkit-appearance:none;
    font-family:var(--mono);
    font-size:11px;
    font-weight:600;
    letter-spacing:.03em;
    text-transform:uppercase;
    padding:6px 26px 6px 10px;
    border-radius:6px;
    border:1px solid var(--border-strong);
    background:var(--pending-bg);
    color:var(--ink-soft);
    cursor:pointer;
  }
  select.status-select:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  select.status-select[data-val="pending"]{ background:var(--pending-bg); color:var(--ink-soft); border-color:var(--border-strong); }
  select.status-select[data-val="pass"]{ background:var(--pass); color:#fff; border-color:var(--pass); }
  select.status-select[data-val="fail"]{ background:var(--fail); color:#fff; border-color:var(--fail); }
  select.status-select:disabled{ cursor:not-allowed; opacity:.55; }
  .status-select-wrap::after{
    content:'';
    position:absolute;
    right:9px; top:50%;
    width:6px; height:6px;
    border-right:2px solid currentColor;
    border-bottom:2px solid currentColor;
    transform:translateY(-65%) rotate(45deg);
    pointer-events:none;
    color:inherit;
    opacity:.8;
  }
  .status-select-wrap[data-val="pending"]{ color:var(--ink-soft); }
  .status-select-wrap[data-val="pass"]{ color:#fff; }
  .status-select-wrap[data-val="fail"]{ color:#fff; }

  .note-toggle{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-family:var(--mono);
    font-size:11px;
    color:var(--primary);
    background:none;
    border:1px dashed var(--border-strong);
    border-radius:6px;
    padding:5px 8px;
    cursor:pointer;
    white-space:nowrap;
  }
  .note-toggle:hover{ background:var(--primary-soft); }
  .note-toggle.has-note{ border-style:solid; border-color:var(--primary); }
  .note-toggle:disabled{ cursor:not-allowed; opacity:.55; }

  .note-box{
    margin:8px 0 4px 66px;
    display:none;
  }
  .note-box.open{ display:block; }
  .note-box textarea{
    width:100%;
    min-height:56px;
    resize:vertical;
    font-family:var(--sans);
    font-size:13px;
    padding:8px 10px;
    border:1px solid var(--border-strong);
    border-radius:6px;
    background:var(--surface-alt);
    color:var(--ink);
  }
  .note-box textarea:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .note-box textarea:disabled{ cursor:not-allowed; opacity:.55; }
  .note-hint{
    font-family:var(--mono);
    font-size:10px;
    color:var(--ink-faint);
    margin-top:3px;
  }

  /* ---------- Empty state (no test cases loaded yet) ---------- */
  .empty-state{
    background:var(--surface);
    border:1px dashed var(--border-strong);
    border-radius:var(--radius);
    padding:48px 24px;
    text-align:center;
    color:var(--ink-soft);
  }
  .empty-state p{ margin:0 0 6px; }
  .empty-state .empty-hint{
    font-size:13.5px;
    color:var(--ink-faint);
    margin-bottom:18px;
  }
  .empty-state button.btn{ margin:0 auto; }

  /* ---------- Responsive ---------- */
  @media (max-width:720px){
    .stat-grid{ grid-template-columns:repeat(2,1fr); }
    .head-top{ flex-direction:column; }
    .test-controls{ margin-left:0; width:100%; justify-content:space-between; }
    .test-id{ min-width:auto; }
    .note-box{ margin-left:0; }
    .module-head{ flex-wrap:wrap; }
  }

  /* Applied while html2pdf is capturing the page */
  body.generating-pdf header.report-head{ position:static; box-shadow:none; }
  body.generating-pdf .head-actions,
  body.generating-pdf .toolbar,
  body.generating-pdf .note-toggle,
  body.generating-pdf .chevron-icon,
  body.generating-pdf .menu-wrap{ display:none; }
  body.generating-pdf .module.collapsed .module-body{ display:block; }
  body.generating-pdf .submodule.collapsed .submodule-body{ display:block; }
  body.generating-pdf .test-row.filtered-out{ display:block; }
  body.generating-pdf .submodule.filtered-out{ display:block; }
  body.generating-pdf .module.filtered-out{ display:block; }
  body.generating-pdf .module{ box-shadow:none; break-inside:avoid; }

  /* Focus visibility */
  a:focus-visible, button:focus-visible, textarea:focus-visible, select:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
  }

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(21,34,56,0.45);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:100;
    padding:20px;
  }
  .modal-overlay.open{ display:flex; }
  .modal-box{
    background:var(--surface);
    border-radius:var(--radius);
    border:1px solid var(--border);
    box-shadow:0 12px 32px rgba(21,34,56,0.18);
    max-width:360px;
    width:100%;
    padding:20px;
  }
  .modal-box h2{
    margin:0 0 8px;
    font-size:16px;
    color:var(--ink);
  }
  .modal-box p{
    margin:0 0 18px;
    font-size:13.5px;
    color:var(--ink-soft);
  }
  .modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:8px;
  }
</style>
</head>
<body>

<header class="report-head">
  <div class="head-inner">
    <div class="head-top">
      <div class="head-title-block">
        <div class="eyebrow">QA · Manual Test Report</div>
        <h1 id="doc-title">QA Testing Report</h1>
      </div>
      <div class="head-actions">
        <button class="btn" id="theme-toggle" aria-pressed="false">
          <svg class="icon" id="theme-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
          <span id="theme-label">Dark mode</span>
        </button>
        <button class="btn" id="import-btn">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
          <span>Import</span>
        </button>
        <input type="file" id="import-input" accept="application/json,.json" style="display:none;">
        <button class="btn" id="pdf-btn">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
          <span id="pdf-label">Download PDF</span>
        </button>
        <button class="btn" id="export-btn">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
          <span>Export</span>

          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
          <span>Reset all</span>

    <div class="stat-grid">
      <div class="stat-tile total">
        <div class="stat-label">Total cases</div>

      </div>
      <div class="stat-tile passed">
        <div class="stat-label">Passed</div>

      </div>
      <div class="stat-tile failed">
        <div class="stat-label">Failed</div>
        <div class="stat-value" id="stat-failed">0</div>
      </div>
      <div class="stat-tile percent">
        <div class="stat-label">% Tested</div>
        <div class="stat-value" id="stat-percent">0%</div>
      </div>
    </div>

    <div class="progress-wrap">
      <div class="progress-track">
        <div class="progress-seg pass" id="bar-pass" style="width:0%"></div>
        <div class="progress-seg fail" id="bar-fail" style="width:0%"></div>
      </div>
      <div class="progress-caption" id="progress-caption">0 / 0 tested</div>
    </div>

    <div class="toolbar">
      <div class="filter-group">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="pending">Pending</button>
        <button class="filter-btn" data-filter="pass">Passed</button>
        <button class="filter-btn" data-filter="fail">Failed</button>
      </div>
      <div class="jump-group">
        <select class="jump-select" id="jump-module">
          <option value="">Jump to module…</option>
        </select>
        <select class="jump-select" id="jump-submodule" style="display:none;">
          <option value="">Jump to sub-module…</option>
        </select>
      </div>
    </div>

    <div class="pinned-bar" id="pinned-bar" style="display:none;">
      <span class="pinned-label">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></svg>
        Pinned
      </span>
      <div class="pinned-items" id="pinned-items"></div>

  </div>
</header>

<main id="report-root"></main>

<div class="modal-overlay" id="confirm-modal">
  <div class="modal-box">
    <h2 id="confirm-title">Are you sure?</h2>
    <p id="confirm-message"></p>
    <div class="modal-actions">
      <button class="btn" id="confirm-no">No</button>
      <button class="btn danger" id="confirm-yes">Yes</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script>
/* ======================================================================
   This page carries no built-in test cases. Test cases arrive at runtime
   via the Import button (a JSON file matching the schema documented in
   README.md) or, if config.json enables it, via the "Load sample data"
   option shown on the empty state.

   Everything below this point — icons, module/sub-module/test-row
   rendering, filters, jump nav, pinned bar, pin/lock, PDF export, dark
   mode, stats — is the same runtime the QA report template uses; only the
   data-loading layer (Import/Export/config/sample, the empty state, and
   the generalized confirm modal) is new.
   ====================================================================== */

/* Lucide icon paths, inlined so the report stays a single file. */
const ICON_PATHS = {
  ellipsisVertical: '<circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/>',
  pin: '<path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/>',
  pinOff: '<path d="M12 17v5"/><path d="M15 9.34V6a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8.32"/><path d="M2 2l20 20"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h11"/><path d="M17 17v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 13 13.86"/>',
  lock: '<rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  lockOpen: '<rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/>',
  chevronDown: '<path d="m6 9 6 6 6-6"/>',
  moon: '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>',
  x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  notePlus: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M12 7v4"/><path d="M10 9h4"/>',
  download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/>',
  upload: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/>'
};
function icon(name, cls){
  return `<svg class="icon ${cls || ''}" viewBox="0 0 24 24" aria-hidden="true">${ICON_PATHS[name] || ''}</svg>`;
}

const root = document.getElementById('report-root');
const jumpModuleSel = document.getElementById('jump-module');
const jumpSubmoduleSel = document.getElementById('jump-submodule');
const pinnedBar = document.getElementById('pinned-bar');
const pinnedItems = document.getElementById('pinned-items');
const docTitleEl = document.getElementById('doc-title');
let currentFilter = 'all';
let openMenuKey = null;
let showSample = false;
let docTitle = docTitleEl.textContent;

/* Builds the numbered module/sub-module/test-row structure from a plain
   { title, subModules: [{ title, tests: [{ text, status?, note? }] }] }
   array — the shape carried by an imported JSON file's "modules" key.
   status/note are optional per test (default "pending"/""); every
   module/sub-module starts collapsed, unpinned, unlocked. */
function buildModules(rawModules){
  return (rawModules || []).map((mod, mi) => {
    const modNum = String(mi + 1);
    const sub = (mod.subModules || []).map((sm, si) => {
      const subNum = `${modNum}.${si + 1}`;
      const tests = (sm.tests || []).map((t, ti) => ({
        id: `${subNum}.${ti + 1}`,
        text: t.text,
        status: (t.status === 'pass' || t.status === 'fail') ? t.status : 'pending',
        note: typeof t.note === 'string' ? t.note : ''
      }));
      return { num: subNum, title: sm.title, tests, pinned: false, locked: false, collapsed: true };
    });
    return { num: modNum, title: mod.title, subModules: sub, pinned: false, locked: false, collapsed: true };
  });
}

let modules = buildModules([]);

function allTests(){
  const out = [];
  modules.forEach(m => m.subModules.forEach(sm => sm.tests.forEach(t => out.push(t))));
  return out;
}

function buildJumpNav(){
  jumpModuleSel.innerHTML = '<option value="">Jump to module…</option>';
  modules.forEach(mod => {
    const opt = document.createElement('option');
    opt.value = mod.num;
    opt.textContent = `${mod.num}. ${mod.title}`;
    jumpModuleSel.appendChild(opt);
  });
}

function jumpTo(id){
  // Expand the target (and its parent module, for a sub-module) in the data
  // model first, since render() rebuilds the DOM from that model.
  if (id.startsWith('mod-')){
    const mod = modules.find(m => m.num === id.slice(4));
    if (mod) mod.collapsed = false;
  } else if (id.startsWith('sub-')){
    const subNum = id.slice(4);
    for (const mod of modules){
      const sm = mod.subModules.find(s => s.num === subNum);
      if (sm){ mod.collapsed = false; sm.collapsed = false; break; }
    }
  }
  render();
  requestAnimationFrame(() => {
    const el = document.getElementById(id);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
}

jumpModuleSel.addEventListener('change', () => {
  const modNum = jumpModuleSel.value;
  jumpSubmoduleSel.innerHTML = '<option value="">Jump to sub-module…</option>';
  if (!modNum){ jumpSubmoduleSel.style.display = 'none'; return; }

  const mod = modules.find(m => m.num === modNum);
  if (mod && mod.subModules.length){
    mod.subModules.forEach(sm => {
      const opt = document.createElement('option');
      opt.value = sm.num;
      opt.textContent = `${sm.num} · ${sm.title}`;
      jumpSubmoduleSel.appendChild(opt);
    });
    jumpSubmoduleSel.style.display = '';
  } else {
    jumpSubmoduleSel.style.display = 'none';
  }
  jumpTo(`mod-${modNum}`);
});

jumpSubmoduleSel.addEventListener('change', () => {
  if (jumpSubmoduleSel.value) jumpTo(`sub-${jumpSubmoduleSel.value}`);
});

function toggleCollapseModule(modNum){
  const mod = modules.find(m => m.num === modNum);
  if (mod) mod.collapsed = !mod.collapsed;
  render();
}

function toggleCollapseSub(subNum){
  for (const mod of modules){
    const sm = mod.subModules.find(s => s.num === subNum);
    if (sm){ sm.collapsed = !sm.collapsed; break; }
  }
  render();
}

function togglePinModule(modNum){
  const mod = modules.find(m => m.num === modNum);
  if (mod) mod.pinned = !mod.pinned;
  render();
}

function togglePinSub(subNum){
  for (const mod of modules){
    const sm = mod.subModules.find(s => s.num === subNum);
    if (sm){ sm.pinned = !sm.pinned; break; }
  }
  render();
}

function toggleLockModule(modNum){
  const mod = modules.find(m => m.num === modNum);
  if (mod) mod.locked = !mod.locked;
  render();
}

function toggleLockSub(subNum){
  for (const mod of modules){
    const sm = mod.subModules.find(s => s.num === subNum);
    if (sm){ sm.locked = !sm.locked; break; }
  }
  render();
}

function closeAllMenus(){
  document.querySelectorAll('.dropdown-menu.open').forEach(m => m.classList.remove('open'));
  document.querySelectorAll('.icon-btn[aria-expanded="true"]').forEach(b => b.setAttribute('aria-expanded', 'false'));
  openMenuKey = null;
}

document.addEventListener('click', (e) => {
  if (!e.target.closest('.menu-wrap')) closeAllMenus();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeAllMenus();
});

/* Builds the ellipsis-vertical "more options" button + its Pin/Lock dropdown,
   shared by module headers and sub-module headers. */
function buildMenuWrap(kind, num, pinned, locked, onPin, onLock){
  const key = `${kind}-${num}`;
  const wrap = document.createElement('div');
  wrap.className = 'menu-wrap';

  const btn = document.createElement('button');
  btn.className = 'icon-btn' + ((pinned || locked) ? ' active-state' : '');
  btn.type = 'button';
  btn.setAttribute('aria-haspopup', 'true');
  btn.setAttribute('aria-expanded', 'false');
  btn.title = 'More options';
  btn.innerHTML = icon('ellipsisVertical');

  const menu = document.createElement('div');
  menu.className = 'dropdown-menu';

  const pinItem = document.createElement('button');
  pinItem.type = 'button';
  pinItem.className = 'dropdown-item';
  pinItem.innerHTML = `${icon(pinned ? 'pinOff' : 'pin')}<span>${pinned ? 'Unpin' : 'Pin'}</span>`;
  pinItem.addEventListener('click', (e) => { e.stopPropagation(); closeAllMenus(); onPin(); });

  const lockItem = document.createElement('button');
  lockItem.type = 'button';
  lockItem.className = 'dropdown-item';
  lockItem.innerHTML = `${icon(locked ? 'lockOpen' : 'lock')}<span>${locked ? 'Unlock' : 'Lock'}</span>`;
  lockItem.addEventListener('click', (e) => { e.stopPropagation(); closeAllMenus(); onLock(); });

  menu.appendChild(pinItem);
  menu.appendChild(lockItem);

  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    const isOpen = menu.classList.contains('open');
    closeAllMenus();
    if (!isOpen){
      menu.classList.add('open');
      btn.setAttribute('aria-expanded', 'true');
      openMenuKey = key;
    }
  });

  wrap.appendChild(btn);
  wrap.appendChild(menu);
  return wrap;
}

function renderPinnedBar(){
  pinnedItems.innerHTML = '';
  let hasPinned = false;

  modules.forEach(mod => {
    if (mod.pinned){
      hasPinned = true;
      pinnedItems.appendChild(buildPinnedChip(`${mod.num}. ${mod.title}`, `mod-${mod.num}`, () => togglePinModule(mod.num)));
    }
    mod.subModules.forEach(sm => {
      if (sm.pinned){
        hasPinned = true;
        pinnedItems.appendChild(buildPinnedChip(`${sm.num} · ${sm.title}`, `sub-${sm.num}`, () => togglePinSub(sm.num)));
      }
    });
  });

  pinnedBar.style.display = hasPinned ? 'flex' : 'none';
}

function buildPinnedChip(label, targetId, onUnpin){
  const chip = document.createElement('div');
  chip.className = 'pinned-chip';
  const btn = document.createElement('button');
  btn.className = 'pinned-chip-label';
  btn.textContent = label;
  btn.addEventListener('click', () => jumpTo(targetId));
  const unpin = document.createElement('button');
  unpin.className = 'pinned-unpin';
  unpin.title = 'Unpin';
  unpin.innerHTML = icon('x', 'icon-sm');
  unpin.addEventListener('click', onUnpin);
  chip.appendChild(btn);
  chip.appendChild(unpin);
  return chip;
}

/* Download PDF / Export / Reset only make sense once test cases exist. */
function updateActionButtons(){
  const hasData = modules.length > 0;
  document.getElementById('pdf-btn').disabled = !hasData;
  document.getElementById('export-btn').disabled = !hasData;
  document.getElementById('reset-btn').disabled = !hasData;
}

function render(){
  updateActionButtons();
  root.innerHTML = '';
  buildJumpNav();

  if (modules.length === 0){
    root.innerHTML = `
      <div class="empty-state">
        <p><strong>No test cases loaded.</strong></p>
        <p class="empty-hint">Click <strong>Import</strong> above and choose a test-cases JSON file to begin.</p>
        ${showSample ? `<button class="btn" id="load-sample-btn" type="button">${icon('download')}<span>Load sample data</span></button>` : ''}
      </div>`;
    const sampleBtn = document.getElementById('load-sample-btn');
    if (sampleBtn) sampleBtn.addEventListener('click', loadSample);
    renderPinnedBar();
    updateStats();
    return;
  }

  modules.forEach(mod => {
    const modEl = document.createElement('section');
    modEl.className = 'module' + (mod.collapsed ? ' collapsed' : '');
    modEl.id = `mod-${mod.num}`;

    const head = document.createElement('div');
    head.className = 'module-head';

    const headLeft = document.createElement('div');
    headLeft.className = 'module-head-left';
    headLeft.innerHTML = `
      <span class="chevron-icon">${icon('chevronDown')}</span>
      <span class="module-num">${mod.num}.</span>
      <span class="module-title">${mod.title}</span>
      <span class="module-count" data-mod-count="${mod.num}"></span>
      <div class="mini-bar" data-mod-bar="${mod.num}">
        <div class="progress-seg pass" style="width:0%"></div>
        <div class="progress-seg fail" style="width:0%"></div>
      </div>
      ${mod.locked ? `<span class="lock-badge" title="Locked">${icon('lock', 'icon-sm')}</span>` : ''}
    `;

    const headMeta = document.createElement('div');
    headMeta.className = 'module-meta';
    headMeta.appendChild(buildMenuWrap('mod', mod.num, mod.pinned, mod.locked,
      () => togglePinModule(mod.num), () => toggleLockModule(mod.num)));

    head.appendChild(headLeft);
    head.appendChild(headMeta);
    head.addEventListener('click', () => toggleCollapseModule(mod.num));
    modEl.appendChild(head);

    const body = document.createElement('div');
    body.className = 'module-body';

    mod.subModules.forEach(sm => {
      const smEl = document.createElement('div');
      smEl.className = 'submodule' + (sm.collapsed ? ' collapsed' : '');
      smEl.id = `sub-${sm.num}`;
      smEl.dataset.subId = sm.num;

      const smTitle = document.createElement('div');
      smTitle.className = 'submodule-title';

      const smHeadLeft = document.createElement('div');
      smHeadLeft.className = 'submodule-head-left';
      smHeadLeft.innerHTML = `
        <span class="chevron-icon">${icon('chevronDown')}</span>
        <span class="sub-num">${sm.num}.</span>
        <span class="sub-title-text">${sm.title}</span>
        <span class="sub-count" data-sub-count="${sm.num}"></span>
        <div class="mini-bar" data-sub-bar="${sm.num}">
          <div class="progress-seg pass" style="width:0%"></div>
          <div class="progress-seg fail" style="width:0%"></div>
        </div>
        ${sm.locked ? `<span class="lock-badge" title="Locked">${icon('lock', 'icon-sm')}</span>` : ''}
      `;

      const smMeta = document.createElement('div');
      smMeta.className = 'submodule-meta';
      smMeta.appendChild(buildMenuWrap('sub', sm.num, sm.pinned, sm.locked,
        () => togglePinSub(sm.num), () => toggleLockSub(sm.num)));

      smTitle.appendChild(smHeadLeft);
      smTitle.appendChild(smMeta);
      smTitle.addEventListener('click', () => toggleCollapseSub(sm.num));
      smEl.appendChild(smTitle);

      const smBody = document.createElement('div');
      smBody.className = 'submodule-body';
      const locked = mod.locked || sm.locked;
      sm.tests.forEach(t => smBody.appendChild(renderTestRow(t, locked)));
      smEl.appendChild(smBody);

      body.appendChild(smEl);
    });

    modEl.appendChild(body);
    root.appendChild(modEl);
  });

  renderPinnedBar();
  updateStats();
}

function renderTestRow(t, locked){
  const row = document.createElement('div');
  row.className = 'test-row' + (locked ? ' locked' : '');
  row.dataset.status = t.status;
  row.dataset.testId = t.id;

  const main = document.createElement('div');
  main.className = 'test-main';
  main.innerHTML = `
    <span class="status-dot ${t.status}"></span>
    <span class="test-id">${t.id}.</span>
    <span class="test-text">${t.text}</span>
    <div class="test-controls">
      <span class="status-select-wrap" data-val="${t.status}">
        <select class="status-select" data-val="${t.status}" ${locked ? 'disabled' : ''}>
          <option value="pending" ${t.status === 'pending' ? 'selected' : ''}>Pending</option>
          <option value="pass" ${t.status === 'pass' ? 'selected' : ''}>Pass</option>
          <option value="fail" ${t.status === 'fail' ? 'selected' : ''}>Fail</option>
        </select>
      </span>
      <button type="button" class="note-toggle ${t.note.trim() ? 'has-note' : ''}" ${locked ? 'disabled' : ''}>${icon('notePlus', 'icon-sm')}<span>Note</span></button>
    </div>`;
  row.appendChild(main);

  const noteBox = document.createElement('div');
  noteBox.className = 'note-box';
  noteBox.innerHTML = `
    <textarea placeholder="Optional note — reproduction steps, screenshot ref, ticket link…" ${locked ? 'disabled' : ''}></textarea>
    <div class="note-hint">Notes are optional for both passed and failed cases.</div>`;
  row.appendChild(noteBox);

  const textarea = noteBox.querySelector('textarea');
  textarea.value = t.note;
  const noteToggle = main.querySelector('.note-toggle');
  const select = main.querySelector('.status-select');
  const selectWrap = main.querySelector('.status-select-wrap');
  const dot = main.querySelector('.status-dot');

  select.addEventListener('change', () => {
    t.status = select.value;
    row.dataset.status = t.status;
    select.dataset.val = t.status;
    selectWrap.dataset.val = t.status;
    dot.className = 'status-dot ' + t.status;
    updateStats();
  });

  noteToggle.addEventListener('click', () => {
    noteBox.classList.toggle('open');
  });

  textarea.addEventListener('input', () => {
    t.note = textarea.value;
    noteToggle.classList.toggle('has-note', t.note.trim().length > 0);
  });

  return row;
}

function updateStats(){
  const tests = allTests();
  const total = tests.length;
  const passed = tests.filter(t => t.status === 'pass').length;
  const failed = tests.filter(t => t.status === 'fail').length;
  const tested = passed + failed;
  const pct = total ? Math.round((tested / total) * 100) : 0;

  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-passed').textContent = passed;
  document.getElementById('stat-failed').textContent = failed;
  document.getElementById('stat-percent').textContent = pct + '%';

  document.getElementById('bar-pass').style.width = (total ? (passed/total*100) : 0) + '%';
  document.getElementById('bar-fail').style.width = (total ? (failed/total*100) : 0) + '%';
  document.getElementById('progress-caption').textContent = `${tested} / ${total} tested · ${passed} pass · ${failed} fail`;

  // per-module and per-sub-module mini stats
  modules.forEach(mod => {
    const mTests = mod.subModules.flatMap(sm => sm.tests);
    const mTotal = mTests.length;
    const mPass = mTests.filter(t => t.status === 'pass').length;
    const mFail = mTests.filter(t => t.status === 'fail').length;
    const countEl = document.querySelector(`[data-mod-count="${mod.num}"]`);
    if (countEl) countEl.textContent = `${mPass + mFail}/${mTotal}`;
    const barEl = document.querySelector(`[data-mod-bar="${mod.num}"]`);
    if (barEl){
      barEl.children[0].style.width = (mTotal ? (mPass/mTotal*100) : 0) + '%';
      barEl.children[1].style.width = (mTotal ? (mFail/mTotal*100) : 0) + '%';
    }

    mod.subModules.forEach(sm => {
      const sTotal = sm.tests.length;
      const sPass = sm.tests.filter(t => t.status === 'pass').length;
      const sFail = sm.tests.filter(t => t.status === 'fail').length;
      const sCountEl = document.querySelector(`[data-sub-count="${sm.num}"]`);
      if (sCountEl) sCountEl.textContent = `${sPass + sFail}/${sTotal}`;
      const sBarEl = document.querySelector(`[data-sub-bar="${sm.num}"]`);
      if (sBarEl){
        sBarEl.children[0].style.width = (sTotal ? (sPass/sTotal*100) : 0) + '%';
        sBarEl.children[1].style.width = (sTotal ? (sFail/sTotal*100) : 0) + '%';
      }
    });
  });

  applyFilter();
}

function applyFilter(){
  document.querySelectorAll('.test-row').forEach(row => {
    const show = currentFilter === 'all' || row.dataset.status === currentFilter;
    row.classList.toggle('filtered-out', !show);
  });

  // Hide sub-module blocks that have no visible test rows left. While a
  // status filter is active, auto-expand sub-modules with visible matches
  // (otherwise the default-collapsed state would hide everything the filter
  // is meant to surface); restore the saved collapsed state once back to "All".
  document.querySelectorAll('.submodule').forEach(smEl => {
    const hasVisible = !!smEl.querySelector('.test-row:not(.filtered-out)');
    smEl.classList.toggle('filtered-out', !hasVisible);

    if (currentFilter !== 'all'){
      if (hasVisible) smEl.classList.remove('collapsed');
    } else {
      const subNum = smEl.dataset.subId;
      const parentMod = modules.find(m => m.subModules.some(s => s.num === subNum));
      const sm = parentMod && parentMod.subModules.find(s => s.num === subNum);
      smEl.classList.toggle('collapsed', !!(sm && sm.collapsed));
    }
  });

  // Hide whole modules that have no visible sub-modules left; same
  // auto-expand / restore behavior as sub-modules above.
  document.querySelectorAll('.module').forEach(modEl => {
    const hasVisible = !!modEl.querySelector('.submodule:not(.filtered-out)');
    modEl.classList.toggle('filtered-out', !hasVisible);

    const modNum = modEl.id.replace('mod-', '');
    if (currentFilter !== 'all'){
      if (hasVisible) modEl.classList.remove('collapsed');
    } else {
      const mod = modules.find(m => m.num === modNum);
      modEl.classList.toggle('collapsed', !!(mod && mod.collapsed));
    }
  });
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    currentFilter = btn.dataset.filter;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b === btn));
    applyFilter();
  });
});

/* Theme toggle — light/dark, kept in memory for this session */
const themeBtn = document.getElementById('theme-toggle');
const themeIcon = document.getElementById('theme-icon');
const themeLabel = document.getElementById('theme-label');
const htmlEl = document.documentElement;
function setTheme(theme){
  htmlEl.dataset.theme = theme;
  const isDark = theme === 'dark';
  themeIcon.innerHTML = isDark ? ICON_PATHS.sun : ICON_PATHS.moon;
  themeLabel.textContent = isDark ? 'Light mode' : 'Dark mode';
  themeBtn.setAttribute('aria-pressed', isDark);
}
const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
setTheme(prefersDark ? 'dark' : 'light');
themeBtn.addEventListener('click', () => {
  setTheme(htmlEl.dataset.theme === 'dark' ? 'light' : 'dark');
});

/* PDF export — renders the same page into a downloadable PDF via html2pdf.js */
document.getElementById('pdf-btn').addEventListener('click', () => {
  const btn = document.getElementById('pdf-btn');
  const label = document.getElementById('pdf-label');
  const originalLabel = label.textContent;
  btn.disabled = true;
  label.textContent = 'Generating…';

  document.querySelectorAll('.module.collapsed').forEach(m => m.classList.add('was-collapsed'));
  document.querySelectorAll('.submodule.collapsed').forEach(m => m.classList.add('was-collapsed-sub'));
  document.body.classList.add('generating-pdf');

  const opt = {
    margin:       [10, 10, 12, 10],
    filename:     `qa-test-report-${new Date().toISOString().slice(0,10)}.pdf`,
    image:        { type: 'jpeg', quality: 0.98 },
    html2canvas:  { scale: 2, useCORS: true },
    jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' },
    pagebreak:    { mode: ['css', 'legacy'] }
  };

  html2pdf().set(opt).from(document.body).save().then(() => {
    document.body.classList.remove('generating-pdf');
    document.querySelectorAll('.was-collapsed').forEach(m => { m.classList.add('collapsed'); m.classList.remove('was-collapsed'); });
    document.querySelectorAll('.was-collapsed-sub').forEach(m => { m.classList.add('collapsed'); m.classList.remove('was-collapsed-sub'); });
    btn.disabled = false;
    label.textContent = originalLabel;
  }).catch(() => {
    document.body.classList.remove('generating-pdf');
    btn.disabled = false;
    label.textContent = originalLabel;
    alert('PDF generation failed. Please try again.');
  });
});

/* ---------- Generic confirm modal — shared by Reset, Import, Load sample ---------- */
const confirmModal = document.getElementById('confirm-modal');
const confirmTitleEl = document.getElementById('confirm-title');
const confirmMessageEl = document.getElementById('confirm-message');
let confirmCallback = null;

function confirmModalOpen(title, message, onYes){
  confirmTitleEl.textContent = title;
  confirmMessageEl.textContent = message;
  confirmCallback = onYes;
  confirmModal.classList.add('open');
}
function confirmModalClose(){
  confirmModal.classList.remove('open');
  confirmCallback = null;
}
document.getElementById('confirm-no').addEventListener('click', confirmModalClose);
document.getElementById('confirm-yes').addEventListener('click', () => {
  const cb = confirmCallback;
  confirmModalClose();
  if (cb) cb();
});
confirmModal.addEventListener('click', (e) => {
  if (e.target === confirmModal) confirmModalClose();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && confirmModal.classList.contains('open')) confirmModalClose();
});

/* Reset all — with confirmation */
document.getElementById('reset-btn').addEventListener('click', () => {
  confirmModalOpen(
    'Reset all test cases?',
    "This sets every test back to Pending and clears all notes. This can't be undone.",
    () => {
      allTests().forEach(t => { t.status = 'pending'; t.note = ''; });
      render();
    }
  );
});

/* ---------- Import ---------- */
const importInput = document.getElementById('import-input');
document.getElementById('import-btn').addEventListener('click', () => importInput.click());
importInput.addEventListener('change', () => {
  const file = importInput.files[0];
  importInput.value = ''; // allow re-selecting the same file later
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let parsed;
    try { parsed = JSON.parse(reader.result); }
    catch (e){ alert('Import failed: the file is not valid JSON.'); return; }
    applyImport(parsed);
  };
  reader.onerror = () => alert('Import failed: could not read the file.');
  reader.readAsText(file);
});

function validateImportShape(parsed){
  if (!parsed || typeof parsed !== 'object' || !Array.isArray(parsed.modules)){
    return 'Missing a "modules" array at the top level.';
  }
  for (const m of parsed.modules){
    if (!m || typeof m.title !== 'string' || !Array.isArray(m.subModules)){
      return 'Each module needs a "title" string and a "subModules" array.';
    }
    for (const sm of m.subModules){
      if (!sm || typeof sm.title !== 'string' || !Array.isArray(sm.tests)){
        return 'Each sub-module needs a "title" string and a "tests" array.';
      }
      for (const t of sm.tests){
        if (!t || typeof t.text !== 'string'){
          return 'Each test needs a "text" string.';
        }
      }
    }
  }
  return null;
}

function applyImport(parsed){
  const err = validateImportShape(parsed);
  if (err){ alert('Import failed: ' + err); return; }

  const doImport = () => {
    if (typeof parsed.docTitle === 'string' && parsed.docTitle.trim()){
      docTitle = parsed.docTitle;
      docTitleEl.textContent = docTitle;
    }
    modules = buildModules(parsed.modules);
    render();
  };

  if (allTests().length > 0){
    confirmModalOpen(
      'Import test cases?',
      "This replaces all currently loaded test cases and progress. This can't be undone.",
      doImport
    );
  } else {
    doImport();
  }
}

/* ---------- Export ---------- */
document.getElementById('export-btn').addEventListener('click', () => {
  const payload = {
    docTitle: docTitle,
    modules: modules.map(mod => ({
      title: mod.title,
      subModules: mod.subModules.map(sm => ({
        title: sm.title,
        tests: sm.tests.map(t => ({ text: t.text, status: t.status, note: t.note }))
      }))
    }))
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `qa-test-results-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

/* ---------- Sample data (only offered when config.json enables it) ---------- */
function loadSample(){
  fetch('sample.json', { cache: 'no-store' })
    .then(res => { if (!res.ok) throw new Error('sample.json not found'); return res.json(); })
    .then(applyImport)
    .catch(() => alert('Could not load sample.json.'));
}

render();

fetch('config.json', { cache: 'no-store' })
  .then(res => (res.ok ? res.json() : {}))
  .then(cfg => { showSample = !!(cfg && cfg.showSample); })
  .catch(() => { showSample = false; })
  .finally(() => { render(); });
</script>
