<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QA Testing Report — Index</title>
<style>
  :root{
    color-scheme: light;
    --bg:#F5F7FA;
    --surface:#FFFFFF;
    --border:#E1E6ED;
    --border-strong:#C9D1DC;
    --ink:#152238;
    --ink-soft:#5B6779;
    --ink-faint:#8B95A5;
    --primary:#164E87;
    --primary-soft:#E8F0FA;
    --accent:#00B2DD;
    --mono: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --radius: 10px;
    --shadow: 0 1px 2px rgba(21,34,56,0.04), 0 4px 12px rgba(21,34,56,0.04);
    --hover-bg:#F0F3F7;
  }
  html[data-theme="dark"]{
    color-scheme: dark;
    --bg:#0F1520;
    --surface:#161D2B;
    --border:#2A3448;
    --border-strong:#3A465D;
    --ink:#E7ECF4;
    --ink-soft:#A6B1C4;
    --ink-faint:#6E7A90;
    --primary:#4C9BE8;
    --primary-soft:#16283F;
    --accent:#28C8ED;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 14px rgba(0,0,0,0.28);
    --hover-bg:#1E293C;
  }
  *{box-sizing:border-box;}
  html{ background:var(--bg); }
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .icon{ width:14px; height:14px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; display:block; }

  header{
    border-bottom:1px solid var(--border);
    background:var(--surface);
  }
  .head-inner{
    max-width:900px;
    margin:0 auto;
    padding:40px 24px 28px;
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
  }
  .eyebrow{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--accent);
    font-weight:600;
  }
  h1{
    margin:6px 0 6px;
    font-size:28px;
    font-weight:700;
    letter-spacing:-0.01em;
  }
  .lede{
    margin:0;
    max-width:56ch;
    color:var(--ink-soft);
    font-size:14.5px;
  }
  button.btn{
    appearance:none;
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-family:var(--sans);
    font-size:13px;
    font-weight:600;
    padding:8px 14px;
    border-radius:6px;
    border:1px solid var(--border-strong);
    background:var(--surface);
    color:var(--ink);
    cursor:pointer;
    white-space:nowrap;
  }
  button.btn:hover{ background:var(--hover-bg); }

  main{
    max-width:900px;
    margin:0 auto;
    padding:32px 24px 80px;
  }
  .section-label{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.05em;
    text-transform:uppercase;
    color:var(--ink-faint);
    margin:0 0 12px;
  }

  .report-grid{
    display:grid;
    grid-template-columns:1fr;
    gap:12px;
  }
  .report-card{
    display:block;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:16px 18px;
    text-decoration:none;
    color:inherit;
  }
  .report-card:hover{ border-color:var(--primary); background:var(--hover-bg); }
  .report-card-top{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
  }
  .report-title{ font-size:15.5px; font-weight:700; color:var(--ink); }
  .report-date{
    font-family:var(--mono);
    font-size:11.5px;
    color:var(--ink-faint);
    white-space:nowrap;
  }
  .report-scope{
    margin-top:4px;
    font-size:13px;
    color:var(--ink-soft);
  }

  .empty-state{
    background:var(--surface);
    border:1px dashed var(--border-strong);
    border-radius:var(--radius);
    padding:36px 24px;
    text-align:center;
    color:var(--ink-soft);
    font-size:14px;
  }
  .empty-state code{
    font-family:var(--mono);
    font-size:12.5px;
    background:var(--primary-soft);
    color:var(--primary);
    padding:2px 6px;
    border-radius:4px;
  }

  footer{
    max-width:900px;
    margin:0 auto;
    padding:0 24px 40px;
    color:var(--ink-faint);
    font-size:12px;
  }
  footer a{ color:var(--ink-soft); }

  @media (max-width:600px){
    .head-inner{ flex-direction:column; }
  }
</style>
</head>
<body>

<header>
  <div class="head-inner">
    <div>
      <div class="eyebrow">QA · Testing Report</div>
      <h1>QA Testing Report</h1>
      <p class="lede">Manual, in-app UI QA reports for SILOSS Mobile — interactive checklists testers run by hand, published here as shareable links.</p>
    </div>
    <button class="btn" id="theme-toggle" aria-pressed="false">
      <svg class="icon" id="theme-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
      <span id="theme-label">Dark mode</span>
    </button>
  </div>
</header>

<main>
  <div class="section-label">Published reports</div>
  <div class="report-grid" id="report-grid"></div>
</main>

<footer>
  Template source: <a href="reports/template/qa-testing-report-template.html">reports/template/qa-testing-report-template.html</a> ·
  How to add a report: <a href="docs/generate-report.md">docs/generate-report.md</a>
</footer>

<script>
const ICON_PATHS = {
  moon: '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>'
};

const htmlEl = document.documentElement;
const themeBtn = document.getElementById('theme-toggle');
const themeIcon = document.getElementById('theme-icon');
const themeLabel = document.getElementById('theme-label');
function setTheme(theme){
  htmlEl.dataset.theme = theme;
  const isDark = theme === 'dark';
  themeIcon.innerHTML = isDark ? ICON_PATHS.sun : ICON_PATHS.moon;
  themeLabel.textContent = isDark ? 'Light mode' : 'Dark mode';
  themeBtn.setAttribute('aria-pressed', isDark);
}
const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
setTheme(prefersDark ? 'dark' : 'light');
themeBtn.addEventListener('click', () => setTheme(htmlEl.dataset.theme === 'dark' ? 'light' : 'dark'));

/* Reads reports.json — a flat array of { title, path, date, scope } —
   and renders one card per entry. Add a report by dropping its HTML file
   into reports/testcases/ and appending one entry here. */
async function loadReports(){
  const grid = document.getElementById('report-grid');
  let list = [];
  try {
    const res = await fetch('reports.json', { cache: 'no-store' });
    if (res.ok) list = await res.json();
  } catch (e) {
    // reports.json missing or unreachable (e.g. opened via file://) — fall through to empty state
  }

  if (!Array.isArray(list) || list.length === 0){
    grid.innerHTML = `
      <div class="empty-state">
        No reports published yet.<br>
        Add one: drop the filled report into <code>reports/testcases/</code>,
        then add an entry to <code>reports.json</code>.
      </div>`;
    return;
  }

  list
    .slice()
    .sort((a, b) => (b.date || '').localeCompare(a.date || ''))
    .forEach(r => {
      const card = document.createElement('a');
      card.className = 'report-card';
      card.href = r.path;
      card.innerHTML = `
        <div class="report-card-top">
          <span class="report-title">${r.title}</span>
          <span class="report-date">${r.date || ''}</span>
        </div>
        ${r.scope ? `<div class="report-scope">${r.scope}</div>` : ''}
      `;
      grid.appendChild(card);
    });
}
loadReports();
</script>
</body>
</html>
