<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QA Testing Report</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<div class="head-chrome">
    <div class="head-inner">
      <div class="head-top">
        <div class="head-title-block">
          <div class="eyebrow">QA · Manual Test Report</div>
          <h1 id="doc-title">QA Testing Report</h1>
        </div>
        <button type="button" class="nav-toggle" id="nav-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="head-actions">
          <svg class="icon icon-md nav-toggle-icon" viewBox="0 0 24 24" aria-hidden="true"><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
        </button>
      </div>

      <nav class="head-actions" id="head-actions" aria-label="App actions">
        <button class="btn" id="theme-toggle" aria-pressed="false" aria-label="Dark mode">
          <svg class="icon" id="theme-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
          <span class="btn-label" id="theme-label">Dark mode</span>
        </button>
        <button class="btn" id="import-btn" aria-label="Import">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
          <span class="btn-label">Import</span>
        </button>
        <input type="file" id="import-input" accept="application/json,.json" hidden>
        <div class="export-wrap menu-wrap">
          <button class="btn" id="export-btn" aria-label="Export" aria-haspopup="true" aria-expanded="false">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
            <span class="btn-label">Export</span>
          </button>
          <div class="dropdown-menu export-menu" id="export-menu" role="menu">
            <button type="button" class="dropdown-item" id="export-pdf-btn" role="menuitem">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
              <span>Download PDF</span>
            </button>
            <button type="button" class="dropdown-item" id="export-json-btn" role="menuitem">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M12 18v-6"/><path d="m9 15 3 3 3-3"/></svg>
              <span>Download JSON</span>
            </button>
            <button type="button" class="dropdown-item" id="export-report-btn" role="menuitem">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M8 13h8"/><path d="M8 17h8"/><path d="M8 9h2"/></svg>
              <span>Generate report</span>
            </button>
          </div>
        </div>
        <button class="btn danger" id="reset-btn" aria-label="Reset all">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
          <span class="btn-label">Reset all</span>
        </button>
      </nav>
    </div>
  </div>

  <div class="head-metrics">
    <div class="head-inner">
      <div class="stat-grid">
        <button class="stat-tile total" data-filter="all" type="button">
          <div class="stat-label">Total cases</div>
          <div class="stat-value" id="stat-total">0</div>
        </button>
        <button class="stat-tile passed" data-filter="pass" type="button">
          <div class="stat-label">Passed</div>
          <div class="stat-value" id="stat-passed">0</div>
        </button>
        <button class="stat-tile failed" data-filter="fail" type="button">
          <div class="stat-label">Failed</div>
          <div class="stat-value" id="stat-failed">0</div>
        </button>
        <button class="stat-tile percent" data-filter="pending" type="button">
          <div class="stat-label">Pending</div>
          <div class="stat-value" id="stat-pending">0</div>
        </button>
      </div>

      <div class="progress-wrap">
        <div class="progress-track" id="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Testing progress">
          <div class="progress-fill" id="progress-fill" style="width:0%"></div>
          <span class="progress-label" id="progress-label">0% completed</span>
        </div>
      </div>

      <div class="jump-group">
        <div class="search-wrap">
          <svg class="icon search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="search" class="search-input" id="search-input" placeholder="Search test cases…" aria-label="Search test cases" autocomplete="off">
          <button type="button" class="search-clear-btn" id="search-clear-btn" aria-label="Clear search" hidden>
            <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          </button>
        </div>
        <select class="jump-select" id="jump-module">
          <option value="">Jump to module…</option>
        </select>
        <select class="jump-select" id="jump-submodule" style="display:none;">
          <option value="">Jump to sub-module…</option>
        </select>
      </div>

      <div class="pinned-bar" id="pinned-bar" style="display:none;">
        <span class="pinned-label">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></svg>
          Pinned
        </span>
        <div class="pinned-items" id="pinned-items"></div>
      </div>
    </div>
  </div>

<main id="report-root"></main>

<div class="toast" id="toast" role="alert" aria-live="polite">
  <span class="toast-msg" id="toast-msg"></span>
  <button type="button" class="toast-action" id="toast-action" hidden></button>
</div>

<div class="modal-overlay" id="confirm-modal">
  <div class="modal-box modal-box--closable">
    <button type="button" class="icon-btn modal-close-btn" id="confirm-modal-close" aria-label="Cancel">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </button>
    <h2 id="confirm-title">Are you sure?</h2>
    <p id="confirm-message"></p>

    <div class="modal-actions" id="confirm-actions-default">
      <button class="btn" id="confirm-no">No</button>
      <button class="btn danger" id="confirm-yes">Yes</button>
    </div>

    <div class="modal-actions modal-actions--split" id="confirm-actions-import" hidden>
      <div class="menu-wrap export-wrap confirm-export-wrap">
        <button type="button" class="btn" id="confirm-export-btn" aria-haspopup="true" aria-expanded="false">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
          <span>Export</span>
        </button>
        <div class="dropdown-menu export-menu" id="confirm-export-menu" role="menu">
          <button type="button" class="dropdown-item" id="confirm-export-pdf-btn" role="menuitem">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
            <span>Download PDF</span>
          </button>
          <button type="button" class="dropdown-item" id="confirm-export-json-btn" role="menuitem">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M12 18v-6"/><path d="m9 15 3 3 3-3"/></svg>
            <span>Download JSON</span>
          </button>
          <button type="button" class="dropdown-item" id="confirm-export-report-btn" role="menuitem">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M8 13h8"/><path d="M8 17h8"/><path d="M8 9h2"/></svg>
            <span>Generate report</span>
          </button>
        </div>
      </div>
      <button type="button" class="btn danger" id="confirm-discard-btn">Discard Changes</button>
    </div>
  </div>
</div>

<div class="dropzone-overlay" id="dropzone-overlay" aria-hidden="true">
  <div class="dropzone-box">
    <svg class="icon icon-lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
    <p>Drop JSON file to import</p>
  </div>
</div>

<div class="modal-overlay" id="report-modal" aria-hidden="true">
  <div class="modal-box modal-box--report" role="dialog" aria-modal="true" aria-labelledby="report-modal-title">
    <div class="report-modal-header">
      <div class="report-modal-heading">
        <h2 id="report-modal-title">Test report</h2>
      </div>
      <div class="report-modal-actions">
        <div class="menu-wrap report-settings-wrap">
          <button type="button" class="icon-btn report-modal-action-btn" id="report-settings-btn" aria-haspopup="true" aria-expanded="false" aria-label="Report settings" title="Report settings">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
          <div class="dropdown-menu report-settings-panel" id="report-settings-panel">
            <p class="report-settings-title">Included test cases</p>
            <label class="report-settings-check">
              <input type="checkbox" id="report-setting-all" checked>
              <span>All</span>
            </label>
            <label class="report-settings-check">
              <input type="checkbox" id="report-setting-passed">
              <span>Passed</span>
            </label>
            <label class="report-settings-check">
              <input type="checkbox" id="report-setting-passed-note">
              <span>Passed with note</span>
            </label>
            <label class="report-settings-check">
              <input type="checkbox" id="report-setting-failed">
              <span>Failed only</span>
            </label>
          </div>
        </div>
        <button type="button" class="icon-btn report-modal-action-btn" id="report-modal-close" aria-label="Close report">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
    </div>
    <div class="report-modal-body" id="report-modal-body"></div>
    <div class="report-modal-footer">
      <button type="button" class="btn" id="report-copy-btn">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
        <span id="report-copy-label">Copy to clipboard</span>
      </button>
      <button type="button" class="btn primary" id="report-download-btn">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
        <span>Download</span>
      </button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="js/theme.js"></script>
<script src="js/app.js"></script>
</body>
</html>
